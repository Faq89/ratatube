name: Ratatube CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Verification
        run: npx --workspace=@ratatube/web tsc --noEmit

      - name: Run Test Suite
        run: npm test

      - name: Build Next.js Application
        run: npm run build --workspace=@ratatube/web
